<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="从完整题库随机抽取 30 题的物语系列冷知识挑战。" />
    <meta name="theme-color" content="#f3efe6" />
    <title>怪异·记忆｜物语系列冷知识测验</title>
    <style>:root {
  --ink: #111111;
  --paper: #f3efe6;
  --red: #ef372f;
  --cyan: #6ed8dc;
  --yellow: #f6cf47;
  --soft: #ded8cc;
}

* { box-sizing: border-box; }
html { background: var(--paper); }
html, body { margin: 0; min-height: 100%; }
body { color: var(--ink); font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
button { color: inherit; font: inherit; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
.site-shell { min-height: 100vh; position: relative; overflow: hidden; padding: clamp(24px, 5vw, 72px); }
.decorations { position: absolute; inset: 0; pointer-events: none; }
.deco-kana { position: absolute; right: -5vw; top: -10vh; font-family: "Noto Serif SC", "Songti SC", serif; font-size: clamp(240px, 42vw, 660px); line-height: 1; font-weight: 900; letter-spacing: -.22em; writing-mode: vertical-rl; opacity: .045; }
.deco-red { position: absolute; width: 80vw; height: 14vh; left: 35vw; bottom: 4vh; background: var(--red); transform: rotate(-12deg); }
.deco-cyan { position: absolute; width: 6vw; height: 120vh; right: 20vw; top: -10vh; background: var(--cyan); transform: rotate(12deg); opacity: .9; }
.deco-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(17,17,17,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(17,17,17,.045) 1px, transparent 1px); background-size: 86px 86px; mask-image: linear-gradient(90deg, black, transparent 75%); }
.intro-shell { display: grid; place-items: center; }
.intro-card { width: min(980px, 94vw); position: relative; z-index: 1; padding: clamp(34px, 6vw, 76px) clamp(30px, 7vw, 92px) 38px; border-left: 13px solid var(--ink); background: rgba(243,239,230,.94); box-shadow: 25px 25px 0 var(--ink); }
.eyebrow { display: flex; align-items: center; gap: 12px; font: 800 11px/1 ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .17em; }
.eyebrow span { color: var(--red); }
.eyebrow i { width: 48px; height: 1px; background: var(--ink); }
.issue-stamp { position: absolute; top: 0; right: 9%; padding: 16px 18px 13px; background: var(--red); color: white; text-align: center; font-weight: 900; font-size: 18px; line-height: 1.1; transform: rotate(2deg); }
.issue-stamp small { font-size: 9px; letter-spacing: .16em; }
.vertical-title { position: absolute; right: 3.5%; top: 22%; margin: 0; writing-mode: vertical-rl; font-family: serif; font-size: 13px; letter-spacing: .4em; }
.intro-card h1 { margin: 50px 0 24px; max-width: 720px; font-family: "Noto Serif SC", "Songti SC", STSong, serif; font-size: clamp(52px, 9vw, 104px); line-height: .91; letter-spacing: -.08em; }
.intro-card h1 span { position: relative; z-index: 0; }
.intro-card h1 span::after { content: ""; position: absolute; z-index: -1; left: -3%; right: -5%; bottom: 6%; height: 21%; background: var(--yellow); transform: rotate(-2deg); }
.intro-copy { margin: 0 0 32px; font-size: 16px; line-height: 1.85; letter-spacing: .05em; }
.primary-button { display: flex; align-items: center; justify-content: space-between; min-width: 235px; border: 0; padding: 18px 22px; background: var(--ink); color: white; font-weight: 800; cursor: pointer; box-shadow: 7px 7px 0 var(--red); transition: transform .18s, box-shadow .18s; }
.primary-button:hover { transform: translate(-2px, -2px); box-shadow: 10px 10px 0 var(--red); }
.primary-button b { font-size: 22px; }
.intro-stats { display: flex; gap: 0; margin-top: 52px; width: min(570px, 100%); border-top: 1px solid var(--ink); }
.intro-stats div { flex: 1; display: flex; align-items: baseline; gap: 9px; padding: 15px 16px 0 0; }
.intro-stats b { font: 900 28px/1 ui-monospace, monospace; }
.intro-stats span { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.source-note { margin: 42px 0 0; font-size: 10px; opacity: .55; letter-spacing: .08em; }

.quiz-shell { min-height: 100vh; overflow: hidden; position: relative; background: var(--paper); }
.quiz-shell::before { content: ""; position: fixed; width: 35vw; height: 130vh; right: -10vw; top: -12vh; background: var(--cyan); transform: rotate(9deg); opacity: .32; pointer-events: none; }
.quiz-header { height: 92px; padding: 0 clamp(22px, 5vw, 72px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--ink); position: relative; z-index: 2; }
.wordmark { border: 0; background: none; padding: 0; cursor: pointer; font-family: serif; font-weight: 900; font-size: 29px; letter-spacing: -.12em; }
.wordmark span { margin-left: 15px; font: 700 9px/1 ui-monospace, monospace; letter-spacing: .14em; }
.header-count { display: flex; align-items: baseline; font-family: ui-monospace, monospace; }
.header-count span { margin-right: 12px; font-size: 9px; letter-spacing: .18em; }
.header-count b { font-size: 27px; }
.header-count i { margin: 0 7px; font-style: normal; color: var(--red); }
.header-count em { font-size: 12px; font-style: normal; }
.progress-track { height: 7px; background: rgba(17,17,17,.12); position: relative; z-index: 2; }
.progress-track span { display: block; height: 100%; background: var(--red); transition: width .35s ease; }
.question-stage { width: min(1120px, calc(100% - 44px)); min-height: calc(100vh - 99px); margin: 0 auto; padding: clamp(38px, 6vh, 70px) 0; display: grid; grid-template-columns: 118px minmax(0, 1fr); position: relative; z-index: 1; }
.question-aside { padding-top: 10px; border-right: 1px solid var(--ink); display: flex; flex-direction: column; align-items: center; }
.question-aside b { font: 900 clamp(54px, 7vw, 92px)/.9 ui-monospace, monospace; writing-mode: vertical-rl; transform: rotate(180deg); color: transparent; -webkit-text-stroke: 1px var(--ink); opacity: .45; }
.question-aside span { margin-top: 28px; writing-mode: vertical-rl; font-family: serif; letter-spacing: .38em; font-size: 12px; }
.question-card { padding: 7px 0 20px clamp(34px, 5.5vw, 78px); max-width: 930px; }
.question-meta { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.question-meta span { padding: 6px 11px; background: var(--red); color: white; font-size: 11px; font-weight: 800; letter-spacing: .12em; transform: rotate(-1deg); }
.question-meta i { font: 700 9px/1 ui-monospace, monospace; letter-spacing: .15em; font-style: normal; }
.question-card h2 { margin: 0 0 clamp(28px, 5vh, 48px); min-height: 2.5em; font-family: "Noto Serif SC", "Songti SC", STSong, serif; font-size: clamp(25px, 3.1vw, 41px); line-height: 1.48; letter-spacing: -.025em; }
.options { display: grid; gap: 12px; }
.option { width: 100%; min-height: 67px; display: grid; grid-template-columns: 62px 1fr 44px; align-items: stretch; border: 1px solid var(--ink); padding: 0; background: rgba(243,239,230,.82); text-align: left; cursor: pointer; transition: transform .15s, background .15s, color .15s; }
.option:not(:disabled):hover { transform: translateX(7px); background: var(--ink); color: white; }
.option-letter { display: grid; place-items: center; border-right: 1px solid currentColor; font: 900 17px/1 ui-monospace, monospace; }
.option-text { align-self: center; padding: 15px 20px; font-size: 15px; line-height: 1.6; font-weight: 650; }
.option-mark { display: grid; place-items: center; font-size: 20px; }
.option.correct { background: var(--cyan); border-width: 2px; color: var(--ink); }
.option.wrong { background: var(--red); color: white; border-color: var(--red); }
.option.muted { opacity: .35; }
.feedback { min-height: 86px; margin-top: 20px; padding-top: 16px; border-top: 1px dashed transparent; display: grid; grid-template-columns: 150px 1fr; align-items: center; opacity: 0; transform: translateY(8px); transition: .2s; }
.feedback.visible { border-top-color: rgba(17,17,17,.35); opacity: 1; transform: translateY(0); }
.feedback-status { font-weight: 900; font-size: 18px; }
.feedback-status small { display: block; margin-top: 5px; font: 700 8px/1 ui-monospace, monospace; letter-spacing: .18em; color: var(--red); }
.feedback p { margin: 0; font-size: 13px; line-height: 1.7; }
.question-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.question-footer > span { font: 600 9px/1 ui-monospace, monospace; opacity: .5; letter-spacing: .1em; }
.next-button { min-width: 148px; display: flex; justify-content: space-between; align-items: center; border: 0; padding: 14px 17px; background: var(--ink); color: white; font-size: 13px; font-weight: 800; cursor: pointer; }
.next-button:disabled { opacity: .18; cursor: not-allowed; }
.next-button b { font-size: 19px; }
.corner-copy { position: fixed; right: 18px; bottom: 20px; writing-mode: vertical-rl; font: 700 8px/1 ui-monospace, monospace; letter-spacing: .18em; opacity: .4; }

.result-shell { display: grid; place-items: start center; padding-top: clamp(40px, 8vh, 90px); overflow: auto; }
.result-card { width: min(900px, 94vw); position: relative; z-index: 1; padding: clamp(38px, 6vw, 72px); background: rgba(243,239,230,.95); border-top: 12px solid var(--ink); box-shadow: 20px 20px 0 var(--ink); }
.result-label { margin: 0 0 32px; font: 800 10px/1 ui-monospace, monospace; letter-spacing: .19em; color: var(--red); }
.score-orbit { display: flex; align-items: baseline; position: relative; width: max-content; }
.score-orbit::before { content: ""; position: absolute; width: 150px; height: 150px; left: -20px; top: -10px; border: 2px solid var(--red); border-radius: 50%; transform: rotate(-12deg) scaleY(.72); }
.score-value { font: 900 clamp(92px, 18vw, 180px)/.72 ui-monospace, monospace; letter-spacing: -.12em; }
.score-total { margin-left: 16px; font: 700 20px/1 ui-monospace, monospace; }
.result-card h2 { margin: 42px 0 10px; font-family: serif; font-size: clamp(35px, 6vw, 62px); }
.result-copy { max-width: 600px; margin: 0; line-height: 1.8; }
.result-copy strong { color: var(--red); }
.result-actions { display: flex; gap: 30px; align-items: center; margin-top: 34px; flex-wrap: wrap; }
.text-button { border: 0; border-bottom: 1px solid var(--ink); padding: 8px 0; background: none; font-weight: 800; cursor: pointer; }
.text-button span { margin-left: 14px; color: var(--red); }
.review-list { margin-top: 52px; border-top: 2px solid var(--ink); }
.review-item { display: grid; grid-template-columns: 58px 1fr; gap: 20px; padding: 25px 0; border-bottom: 1px solid rgba(17,17,17,.3); }
.review-number { font: 900 28px/1 ui-monospace, monospace; color: var(--red); }
.review-item p { margin: 0 0 14px; font-family: serif; font-size: 17px; line-height: 1.6; }
.review-item span, .review-item strong { display: block; font-size: 12px; line-height: 1.7; }
.review-item span { opacity: .6; }
.review-item strong { color: #087b7f; }

@media (max-width: 720px) {
  .site-shell { padding: 20px; }
  .intro-card { width: 100%; padding: 38px 27px 30px; border-left-width: 8px; box-shadow: 12px 12px 0 var(--ink); }
  .issue-stamp { right: 6%; padding: 12px; font-size: 14px; }
  .vertical-title { display: none; }
  .intro-card h1 { margin-top: 42px; }
  .intro-copy { font-size: 14px; }
  .intro-stats div { flex-direction: column; gap: 5px; }
  .intro-stats b { font-size: 23px; }
  .source-note { margin-top: 30px; }
  .quiz-header { height: 72px; }
  .wordmark span, .header-count span { display: none; }
  .question-stage { width: calc(100% - 30px); min-height: calc(100vh - 79px); grid-template-columns: 1fr; padding: 28px 0 36px; }
  .question-aside { display: none; }
  .question-card { padding: 0; }
  .question-card h2 { min-height: 0; font-size: 23px; margin-bottom: 26px; }
  .option { grid-template-columns: 48px 1fr 38px; min-height: 62px; }
  .option-text { padding: 13px 14px; font-size: 14px; }
  .feedback { grid-template-columns: 1fr; gap: 8px; min-height: 103px; }
  .question-footer > span { display: none; }
  .question-footer { justify-content: flex-end; }
  .next-button { min-width: 140px; }
  .result-card { width: 100%; padding: 36px 26px; box-shadow: 12px 12px 0 var(--ink); }
  .review-item { grid-template-columns: 38px 1fr; gap: 12px; }
  .review-number { font-size: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

    <script>const QUESTION_BANK = [{"id":1,"category":"动画","prompt":"截至题库编写时，不计《短物语》《混物语》等，已发行的《物语系列》小说共有多少部？","answer":"30部","distractors":["28部","32部"]},{"id":2,"category":"动画","prompt":"《化物语》中，战场原与历边吃便当边商量约会时，她的便当盒是什么样式？","answer":"分体式","distractors":["一体式","双层抽屉式"]},{"id":3,"category":"动画","prompt":"战场原黑仪与阿良良木历第一次约会的日期是？","answer":"6月13日","distractors":["5月14日","7月7日"]},{"id":4,"category":"动画","prompt":"星空约会中，战场原说自己目前能够给予阿良良木君的最后一样东西是什么？","answer":"这片星空","distractors":["一只订书机","她全部的秘密"]},{"id":6,"category":"动画","prompt":"在卧烟伊豆湖的推断中，忍野扇诞生过程的第二阶段以哪件事为代表？","answer":"与初代怪异杀手的对决","distractors":["解决北白蛇神社的蛇神事件","阿良良木历从地狱归来"]},{"id":10,"category":"动画","prompt":"《抚子与你！》中，男主角、抚子就读的学校与年级分别是？","answer":"北极星速／私立15学园／初二","distractors":["蜡烛泽君／直江津中学／初三","阿良良木历／栂之木第二中学／初一"]},{"id":14,"category":"动画","prompt":"真宵姐姐为什么说朽绳是“镜子的专家”？","answer":"“镜”的语源是蛇的眼睛“蛇目”","distractors":["白蛇能在镜中看见人的过去","朽绳曾长期附身在神社的神镜上"]},{"id":16,"category":"动画","prompt":"历前往神原家时被猴子袭击，又被障猫所救；之后他做的第一件事是？","answer":"去书店买小黄书","distractors":["去废弃补习班找忍野","给战场原打电话报平安"]},{"id":18,"category":"动画","prompt":"真宵姐姐所说的“科幻小说三大帅气标题”中，除《唯一巧妙的做法》《仿生人会梦见电子羊吗？》外，第三个是？","answer":"《月亮是无情的夜之女王》","distractors":["《世界尽头与冷酷仙境》","《银河系漫游指南》"]},{"id":19,"category":"动画","prompt":"历进入镜世界后第一次见到火怜时，火怜的内衣是什么颜色？","answer":"粉色","distractors":["红色","黑色"]},{"id":20,"category":"动画","prompt":"镜世界事件当天早上，历幻想自己被警察盘问身份时，会怎样回答？","answer":"阿良良木历，就是如你所见的男人。","distractors":["我是正义的伙伴，阿良良木历。","只是个路过的高中毕业生而已。"]},{"id":22,"category":"动画","prompt":"斧乃木提出解决镜世界最简单的方法时，引用了什么观点？","answer":"哥白尼式的回转","distractors":["奥卡姆剃刀","拉普拉斯的恶魔"]},{"id":24,"category":"动画","prompt":"“如果不能成为药，那就变成毒；否则你只不过是一杯水。”这句话最可能是谁说的？","answer":"卧烟远江","distractors":["贝木泥舟","影缝余弦"]},{"id":25,"category":"动画","prompt":"忍野扇质问历为何连只会批判、责怪他的自己也要救时，历怎样回答？","answer":"我救的不是别人，我现在救的是我自己。","distractors":["因为我不允许任何人在我面前消失。","救你没有意义，但我不需要意义。"]},{"id":27,"category":"动画","prompt":"神原无意识袭击历之后，给自己加上了怎样的限制？","answer":"用胶带把左臂固定在墙上","distractors":["睡觉时给左手戴上手铐","把雨魔的左手封进木箱"]},{"id":31,"category":"动画","prompt":"神原发短信说自己被以前认识的女孩子揉胸后，历回了什么？","answer":"请带我一个！","distractors":["请立刻报警！","请务必详细说明！"]},{"id":32,"category":"动画","prompt":"中学时代，身为篮球高手的神原骏河有怎样的外号？","answer":"神速天使神原","distractors":["直江津的雨魔","瓦尔哈拉组合王牌"]},{"id":35,"category":"动画","prompt":"贝木因上一辈的缘故特别关照神原，请她吃烤肉时付了多少钱？","answer":"5万日元","distractors":["3万日元","10万日元"]},{"id":38,"category":"动画","prompt":"《伪物语》中，战场原持有的贝木名片上，他给自己写的 title 是？","answer":"Ghost-Buster","distractors":["Occult Researcher","Spiritual Counselor"]},{"id":40,"category":"动画","prompt":"《伪物语》中，小忍认为比“摸头”更高一级的仪式是？","answer":"摸胸","distractors":["拥抱","亲吻额头"]},{"id":42,"category":"动画","prompt":"《终物语·下》最后的毕业照片上一共有多少人？","answer":"11人","distractors":["9人","13人"]},{"id":43,"category":"动画","prompt":"贝木泥舟正装领口的装饰符号，是扑克牌四种花色中的哪一种？","answer":"梅花 ♣","distractors":["黑桃 ♠","方块 ♦"]},{"id":46,"category":"动画","prompt":"历问“八九寺，人什么时候才能长大成人呢？”，八九寺如何回答？","answer":"只要嘴上还挂着这种话，那就长不大。","distractors":["等到不再害怕迷路的时候吧。","能够为自己的选择负责时就长大了。"]},{"id":49,"category":"动画","prompt":"《终物语·下》中，忍野扇与阿良良木历的自行车锁密码分别是？","answer":"扇：1234／历：1345","distractors":["扇：1345／历：1234","扇：0000／历：0315"]},{"id":51,"category":"动画","prompt":"“美丽公主”曾试图用什么工具戳瞎自己的眼睛？","answer":"烛台","distractors":["发簪","裁纸刀"]},{"id":55,"category":"动画","prompt":"殊杀尊主的口头禅、或者说标志性台词是？","answer":"看来，我又死了一次。","distractors":["这次总算轮到我杀你了。","死亡不过是下一场战斗。"]},{"id":57,"category":"动画","prompt":"《忍物语》中，历乱入日伞家的睡衣派对后，现场一共有多少人？","answer":"8人","distractors":["6人","9人"]},{"id":58,"category":"动画","prompt":"春假时大忍说人类对她而言是“食物”；《忍物语》中小忍的回答变成了什么？","answer":"是怪物吧。","distractors":["是眷属吧。","是朋友吧。"]},{"id":59,"category":"动画","prompt":"卧烟伊豆湖说，当下之急是建立一个什么部门？","answer":"风说课","distractors":["怪异对策室","传闻管理局"]},{"id":66,"category":"动画","prompt":"解决黑羽川并确认忍野咩咩离开后，历等人不约而同地认为咩咩是“哪个”？","answer":"滥好人","distractors":["大骗子","胆小鬼"]},{"id":67,"category":"动画","prompt":"历为了确认自己是否喜欢羽川，问月火何时、为何喜欢上“蜡烛泽”；月火的回答是？","answer":"自然而然的。","distractors":["从第一次见面开始。","因为他曾经帮助过我。"]},{"id":72,"category":"动画","prompt":"“不幸的女孩子只会更萌，不是吗？我只是想要解决我的——”空缺处是？","answer":"欲求不满","distractors":["好奇心","正义感"]},{"id":73,"category":"动画","prompt":"第一次黑羽川事件中，为从根本上解决羽川的家庭压力，忍野咩咩大胆提出什么建议？","answer":"让历和羽川结婚","distractors":["让羽川搬进战场原家","让羽川离家旅行一年"]},{"id":74,"category":"动画","prompt":"历曾想过，有一句话自己一辈子都不会对羽川翼说。这句话是？","answer":"喜欢羽川翼。","distractors":["我什么都知道。","请你救救我。"]},{"id":75,"category":"小说","prompt":"《恋物语》中，贝木为什么没有答应请斧乃木吃热巧克力司康？","answer":"斧乃木刚才侮辱他像阿良良木","distractors":["店里已经卖完了司康","斧乃木拒绝提供撫子的情报"]},{"id":76,"category":"小说","prompt":"《化物语》中，历与战场原在家一起学习时抄写的是哪篇英语文章？","answer":"林肯的葛底斯堡演说","distractors":["马丁·路德·金《我有一个梦想》","《独立宣言》序言"]},{"id":77,"category":"小说","prompt":"剧情开始前，战场原就注意到了阿良良木，理由是什么？","answer":"因为观察吊车尾很有趣","distractors":["因为他在春假突然缺席","因为羽川经常提起他"]},{"id":78,"category":"小说","prompt":"战场原黑仪在初中时最喜欢的运动是？","answer":"投标枪","distractors":["短跑","跳高"]},{"id":80,"category":"小说","prompt":"高二时，历错过班级组织的试胆大会，直接原因是什么？","answer":"没人知道他的电话号码，无法邀请","distractors":["他去补习班照顾小忍","他误记了活动日期"]},{"id":81,"category":"小说","prompt":"月火经常参加志愿活动，理由是什么？","answer":"偶尔惹事也能被原谅","distractors":["为了积累升学需要的履历","为了监视火怜的正义活动"]},{"id":82,"category":"小说","prompt":"八九寺问“天国”会让历联想到什么，历思索后给出的答案是？","answer":"真要说的话，就是羽川吧。","distractors":["真要说的话，就是战场原吧。","真要说的话，就是小忍吧。"]},{"id":84,"category":"小说","prompt":"《物语系列》为何又被称作“蚁物语”？","answer":"副音轨中与蚂蚁有关的话题出现频率很高","distractors":["“物语”的日文写法形似蚂蚁","西尾维新早期曾计划以蚁怪异为主角"]},{"id":85,"category":"小说","prompt":"《历·种子》中，阿良良木说出的座右铭是什么？","answer":"对女童温柔。","distractors":["朋友不需要很多。","人只能自己救自己。"]},{"id":86,"category":"小说","prompt":"《忍·铠甲》中，神原用什么例子形容自己为历操心时的悲伤？","answer":"喜欢的歌手出精选集，却没收录自己喜欢的歌","distractors":["支持的篮球队进入决赛，却输在最后一秒","买到期待已久的小说，发现缺了最后一页"]},{"id":87,"category":"小说","prompt":"斧乃木用什么比喻回应历“有没有想做的事或想要的东西”？","answer":"就像问马克杯更喜欢装红茶还是咖啡","distractors":["就像问人偶更喜欢晴天还是雨天","就像问剪刀更喜欢裁纸还是布料"]},{"id":89,"category":"小说","prompt":"卧烟远江指出羽川与伊豆湖共同忽略了知识中的哪种情形？","answer":"以为自己知道，实际却以错误方式理解","distractors":["知道得越多，就越难采取行动","不知道本身也可能是一种才能"]},{"id":90,"category":"小说","prompt":"历说自己不擅长背诵所以历史很差时，羽川如何回应？","answer":"只要有心，世界史和日本史的答案也能用公式导出","distractors":["历史不是背诵，而是理解人物的选择","把年代编成顺口溜就完全不会忘记"]},{"id":91,"category":"小说","prompt":"历问羽川有没有打工的想法时，羽川怎样回答？","answer":"觉得自己还没有足够的价值在社会中工作","distractors":["校规禁止学生从事任何兼职","想等高中毕业后再专心工作"]},{"id":92,"category":"小说","prompt":"羽川放学后为何只去镇上的图书馆，而不去校内图书馆？","answer":"学校图书馆的书已经全读完了","distractors":["学校图书馆禁止借阅怪异相关书籍","镇图书馆闭馆更晚、离家更远"]},{"id":93,"category":"小说","prompt":"直江津高中不禁止染发，历曾表示想看羽川的什么发型？","answer":"茶发卷毛","distractors":["金色双马尾","银色齐耳短发"]},{"id":95,"category":"小说","prompt":"羽川中学时曾有一段时间没有作业可写，原因是什么？","answer":"班主任不想打扰羽川学习","distractors":["她提前写完了整学期的作业","学校认为她不需要参加家庭作业"]}];
const app = document.querySelector("#app");
const LETTERS = ["A", "B", "C"];
let phase = "intro";
let session = [];
let currentIndex = 0;
let selected = null;
let responses = [];
let showReview = false;

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;",
  })[character]);
}

function decorations() {
  return '<div class="decorations" aria-hidden="true"><div class="deco-kana">物語</div><div class="deco-red"></div><div class="deco-cyan"></div><div class="deco-grid"></div></div>';
}

function begin() {
  session = shuffle(QUESTION_BANK).slice(0, 30).map((question) => ({
    ...question,
    options: shuffle([question.answer, ...question.distractors]),
  }));
  currentIndex = 0;
  selected = null;
  responses = [];
  showReview = false;
  phase = "quiz";
  render();
}

function choose(option) {
  if (selected) return;
  selected = option;
  render();
}

function advance() {
  if (!selected) return;
  const question = session[currentIndex];
  responses.push({ question, chosen: selected, correct: selected === question.answer });
  selected = null;
  if (currentIndex === session.length - 1) phase = "result";
  else currentIndex += 1;
  render();
}

function renderIntro() {
  app.innerHTML = `<main class="site-shell intro-shell">${decorations()}<section class="intro-card">
    <div class="eyebrow"><span>MONOGATARI</span><i></i> QUIZ ARCHIVE 07</div>
    <div class="issue-stamp">第七回<br><small>怪异调查</small></div>
    <p class="vertical-title" aria-hidden="true">ものがたり</p>
    <h1><span>怪异</span>·记忆<br>冷知识测验</h1>
    <p class="intro-copy">答案并不会自己浮现。<br>你所知道的，只是你知道的而已。</p>
    <button class="primary-button" id="start" type="button"><span>开始答题</span><b>→</b></button>
    <div class="intro-stats" aria-label="测验信息"><div><b>${QUESTION_BANK.length}</b><span>题库总数</span></div><div><b>30</b><span>随机抽取</span></div><div><b>3</b><span>每题选项</span></div></div>
    <p class="source-note">题目整理自「物语系列 B 萌群第七届冷知识竞赛」</p>
  </section></main>`;
  document.querySelector("#start").addEventListener("click", begin);
}

function renderQuiz() {
  const question = session[currentIndex];
  const answeredCorrectly = selected === question.answer;
  const options = question.options.map((option, index) => {
    const isSelected = selected === option;
    const isAnswer = Boolean(selected) && option === question.answer;
    const state = isAnswer ? " correct" : isSelected ? " wrong" : selected ? " muted" : "";
    const mark = isAnswer ? "○" : isSelected ? "×" : "↗";
    return `<button class="option${state}" data-option="${index}" type="button" role="radio" aria-checked="${isSelected}" ${selected ? "disabled" : ""}><span class="option-letter">${LETTERS[index]}</span><span class="option-text">${escapeHtml(option)}</span><span class="option-mark">${mark}</span></button>`;
  }).join("");
  const feedback = selected ? `<div class="feedback-status">${answeredCorrectly ? "回答正确" : "记忆偏差"}<small>${answeredCorrectly ? "CORRECT" : "INCORRECT"}</small></div><p>${answeredCorrectly ? "不错。看来这只怪异没能骗过你。" : `正确答案是：<strong>${escapeHtml(question.answer)}</strong>`}</p>` : "";
  app.innerHTML = `<main class="quiz-shell"><header class="quiz-header"><button class="wordmark" id="home" type="button" aria-label="返回首页">物語 <span>MONOGATARI QUIZ</span></button><div class="header-count"><span>QUESTION</span><b>${String(currentIndex + 1).padStart(2, "0")}</b><i>/</i><em>30</em></div></header>
    <div class="progress-track"><span style="width:${((currentIndex + 1) / 30) * 100}%"></span></div>
    <section class="question-stage"><div class="question-aside" aria-hidden="true"><b>${String(currentIndex + 1).padStart(2, "0")}</b><span>怪異譚</span></div><article class="question-card">
      <div class="question-meta"><span>${escapeHtml(question.category)}区</span><i>ARCHIVE NO. ${String(question.id).padStart(3, "0")}</i></div>
      <h2>${escapeHtml(question.prompt)}</h2><div class="options" role="radiogroup" aria-label="答案选项">${options}</div>
      <div class="feedback ${selected ? "visible" : ""}" aria-live="polite">${feedback}</div>
      <div class="question-footer"><span>按数字键 1—3 选择</span><button class="next-button" id="next" type="button" ${selected ? "" : "disabled"}>${currentIndex === 29 ? "查看结果" : "下一题"}<b>→</b></button></div>
    </article></section><div class="corner-copy" aria-hidden="true">KAII / MEMORY / ANSWER</div></main>`;
  document.querySelector("#home").addEventListener("click", () => { phase = "intro"; render(); });
  document.querySelectorAll("[data-option]").forEach((button) => button.addEventListener("click", () => choose(question.options[Number(button.dataset.option)])));
  document.querySelector("#next").addEventListener("click", advance);
}

function renderResult() {
  const score = responses.filter((response) => response.correct).length;
  const missed = responses.filter((response) => !response.correct);
  const rate = Math.round((score / responses.length) * 100);
  const verdict = rate >= 90 ? "怪异专家" : rate >= 70 ? "资深观测者" : rate >= 50 ? "见习调查员" : "迷途蜗牛";
  const review = showReview ? `<div class="review-list">${missed.map((item, index) => `<article class="review-item"><div class="review-number">${String(index + 1).padStart(2, "0")}</div><div><p>${escapeHtml(item.question.prompt)}</p><span>你的答案：${escapeHtml(item.chosen)}</span><strong>正确答案：${escapeHtml(item.question.answer)}</strong></div></article>`).join("")}</div>` : "";
  app.innerHTML = `<main class="site-shell result-shell">${decorations()}<section class="result-card"><p class="result-label">CASE CLOSED // 调查结束</p><div class="score-orbit"><span class="score-value">${score}</span><span class="score-total">/ 30</span></div><h2>${verdict}</h2><p class="result-copy">本轮正确率 <strong>${rate}%</strong>。${missed.length === 0 ? "没有任何怪异逃过你的眼睛。" : `还有 ${missed.length} 条记忆出现了偏差。`}</p><div class="result-actions"><button class="primary-button" id="restart" type="button"><span>再抽 30 题</span><b>↻</b></button>${missed.length ? `<button class="text-button" id="review" type="button">${showReview ? "收起错题" : "查看错题"} <span>＋</span></button>` : ""}</div>${review}</section></main>`;
  document.querySelector("#restart").addEventListener("click", begin);
  document.querySelector("#review")?.addEventListener("click", () => { showReview = !showReview; render(); });
}

function render() {
  if (phase === "intro") renderIntro();
  else if (phase === "quiz") renderQuiz();
  else renderResult();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.addEventListener("keydown", (event) => {
  if (phase !== "quiz") return;
  if (!selected && ["1", "2", "3"].includes(event.key)) choose(session[currentIndex].options[Number(event.key) - 1]);
  else if (selected && event.key === "Enter") advance();
});

render();
</script>

</html>
